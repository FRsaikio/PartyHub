<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Traître · PartyHub</title>
  <meta name="theme-color" content="#08061a" />
  <link rel="icon" href="../../partyhub-logo-neon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;700;800&display=swap" />
  <link rel="stylesheet" href="../../neon-club.css" />
  <link rel="stylesheet" href="../../neon-game.css" />
  <link rel="stylesheet" href="mission-traitre.css" />
</head>

<body>
  <div class="background"></div>

  <main class="app mt-app">

    <div class="game-header mt-header">
      <button id="backToLobbyBtn" class="btn danger small" type="button">Retour lobby</button>
      <div>
        <span id="roomBadge" class="badge">Room</span>
        <h2>Mission <span class="mt-red">Traître</span></h2>
        <p class="muted">Des traîtres se cachent parmi vous. Démasquez-les avant qu'il ne soit trop tard.</p>
      </div>
      <span id="mtRound" class="mt-round">Avant-partie</span>
    </div>

    <div class="mt-layout">
      <div class="mt-main">
        <section id="mtStage" class="mt-stage" aria-live="polite"></section>
        <div id="mtHost" class="mt-host" hidden></div>
        <section id="mtRole" class="mt-role" hidden aria-label="Ton rôle secret"></section>
      </div>

      <aside class="mt-side">
        <section class="mt-players-box">
          <h3>Les joueurs</h3>
          <div id="mtPlayers" class="mt-players"></div>
        </section>
        <details class="mt-log">
          <summary>📜 Journal</summary>
          <ol id="mtLog"></ol>
        </details>
      </aside>
    </div>

  </main>

  <script src="../../partyhub-fx.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
