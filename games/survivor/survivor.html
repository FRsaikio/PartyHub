<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Survivor · PartyHub</title>

  <meta name="theme-color" content="#08061a" />
  <link rel="icon" href="../../partyhub-logo-neon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;700;800&display=swap" />
  <link rel="stylesheet" href="../../neon-club.css" />
  <link rel="stylesheet" href="../../neon-game.css" />
  <link rel="stylesheet" href="survivor.css" />
</head>

<body>
  <div class="background"></div>

  <main class="app sv-app">

    <div class="game-header sv-header">
      <button id="backToLobbyBtn" class="btn danger small" type="button">Retour lobby</button>
      <div>
        <span id="roomBadge" class="badge">Room</span>
        <h2>Survivor <span class="sv-flame">🔥</span></h2>
        <p class="muted">Épreuves, conseil secret, idoles cachées. Une seule personne quittera l'île en vainqueur.</p>
      </div>
      <span id="svRound" class="sv-round">Avant-match</span>
    </div>

    <div class="sv-layout">
      <div class="sv-main">
        <section id="svStage" class="sv-stage" aria-live="polite"></section>
        <div id="svHost" class="sv-host" hidden></div>
        <section id="svMe" class="sv-me" hidden aria-label="Ton sac secret"></section>
      </div>

      <aside class="sv-side">
        <section class="sv-tribe-box">
          <h3>La tribu</h3>
          <div id="svTribe" class="sv-tribe"></div>
        </section>
        <details class="sv-log">
          <summary>📜 Journal de l'île</summary>
          <ol id="svLog"></ol>
        </details>
      </aside>
    </div>

  </main>

  <script src="../../partyhub-fx.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
