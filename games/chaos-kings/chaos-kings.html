<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaos Kings · PartyHub</title>
  <meta name="theme-color" content="#08061a" />
  <link rel="icon" href="../../partyhub-logo-neon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;700;800&display=swap" />
  <link rel="stylesheet" href="../../neon-club.css" />
  <link rel="stylesheet" href="../../neon-game.css" />
  <link rel="stylesheet" href="chaos-kings.css" />
</head>

<body>
  <div class="background"></div>

  <main class="app ck-app">

    <div class="game-header ck-header">
      <button id="backToLobbyBtn" class="btn danger small" type="button">Retour lobby</button>
      <div>
        <span id="roomBadge" class="badge">Room</span>
        <h2>Chaos <span class="ck-gold">Kings</span></h2>
        <p class="muted">52 cartes, 4 rois, une coupe. Celui qui tire le dernier roi la boit.</p>
      </div>
      <span id="ckTurn" class="ck-turn">Avant-partie</span>
    </div>

    <div class="ck-layout">
      <section class="ck-stage">
        <div class="ck-table">
          <div id="ckDeck" class="ck-deck">🂠 52 cartes</div>
          <div id="ckCard" class="ck-card back"><span class="ck-card-logo">👑</span></div>
          <div id="ckCup" class="ck-cup" aria-label="La Chaos Cup">
            <div class="ck-cup-glass"><span class="ck-cup-liquid"></span></div>
            <span class="ck-cup-label">0/4 rois</span>
          </div>
        </div>
        <div id="ckChaos" class="ck-chaos" aria-label="Niveau de chaos">
          <span>🔥 Chaos</span>
          <div class="ck-chaos-bar"><i></i></div>
          <em>0%</em>
        </div>
      </section>

      <section class="ck-side">
        <div id="ckPanel" class="ck-panel" aria-live="polite"></div>
        <div id="ckHost" class="ck-host" hidden></div>
        <div class="ck-box">
          <h3>📜 Règles en vigueur</h3>
          <ul id="ckRules" class="ck-rules"></ul>
        </div>
        <div class="ck-box">
          <h3>Les joueurs</h3>
          <div id="ckPlayers" class="ck-players"></div>
        </div>
        <details class="ck-box ck-log">
          <summary>📜 Journal</summary>
          <ol id="ckLog"></ol>
        </details>
      </section>
    </div>

  </main>

  <script src="../../partyhub-fx.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
