<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monopoly Party · PartyHub</title>
  <meta name="theme-color" content="#08061a" />
  <link rel="icon" href="../../partyhub-logo-neon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;700;800&display=swap" />
  <link rel="stylesheet" href="../../neon-club.css" />
  <link rel="stylesheet" href="../../neon-game.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="background"></div>

  <main class="app mp-app">

    <div class="game-header mp-header">
      <button id="backToLobbyBtn" class="btn danger small" type="button">Retour lobby</button>
      <div>
        <span id="roomBadge" class="badge">Room</span>
        <h2>Monopoly <span class="mp-gold">Party</span></h2>
        <p class="muted">Achète les quartiers, rénove, et fais boire tous ceux qui passent chez toi.</p>
      </div>
      <span id="mpRound" class="mp-round">Avant-partie</span>
    </div>

    <div class="mp-layout">
      <section class="mp-board-wrap">
        <div id="mpBoard" class="mp-board">
          <div id="mpCenter" class="mp-center"></div>
        </div>
      </section>

      <section class="mp-side">
        <div id="mpPanel" class="mp-panel" aria-live="polite"></div>
        <div id="mpHost" class="mp-host" hidden></div>
        <div id="mpPlaces" class="mp-box mp-places" hidden></div>
        <div class="mp-box">
          <span class="mp-box-title">💰 Classement</span>
          <div id="mpPlayers" class="mp-players"></div>
        </div>
        <details class="mp-box mp-log">
          <summary>📜 Journal</summary>
          <ol id="mpLog"></ol>
        </details>
      </section>
    </div>

  </main>

  <script src="../../partyhub-fx.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
