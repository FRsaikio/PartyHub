<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Je n'ai jamais · PartyHub</title>
  <meta name="theme-color" content="#08061a" />
  <link rel="icon" href="../../partyhub-logo-neon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;700;800&display=swap" />
  <link rel="stylesheet" href="../../neon-club.css" />
  <link rel="stylesheet" href="../../neon-game.css" />
  <link rel="stylesheet" href="never-have-i-ever.css" />
</head>

<body>
  <div class="background"></div>

  <main class="app nv-app">

    <div class="game-header nv-header">
      <button id="backToLobbyBtn" class="btn danger small" type="button">Retour lobby</button>
      <div>
        <span id="roomBadge" class="badge">Room</span>
        <h2>Je n'ai <span class="nv-violet">jamais</span></h2>
        <p class="muted">Réponses secrètes, révélation d'un coup. Les masques tombent.</p>
      </div>
      <span id="nvRound" class="nv-round">Avant-partie</span>
    </div>

    <div class="nv-layout">
      <div class="nv-main">
        <section id="nvStage" class="nv-stage" aria-live="polite"></section>
        <div id="nvHost" class="nv-host" hidden></div>
      </div>
      <aside class="nv-side">
        <section class="nv-box">
          <h3>Classement <small>🍻 déjà fait · 🔮 pronostics</small></h3>
          <div id="nvBoard" class="nv-board"></div>
        </section>
        <details class="nv-box nv-hist">
          <summary>📜 Questions jouées</summary>
          <ol id="nvHistory"></ol>
        </details>
      </aside>
    </div>

  </main>

  <script src="../../partyhub-fx.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
