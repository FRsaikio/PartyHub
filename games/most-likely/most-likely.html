<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Most Likely · PartyHub</title>
  <meta name="theme-color" content="#08061a" />
  <link rel="icon" href="../../partyhub-logo-neon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;700;800&display=swap" />
  <link rel="stylesheet" href="../../neon-club.css" />
  <link rel="stylesheet" href="../../neon-game.css" />
  <link rel="stylesheet" href="most-likely.css" />
</head>

<body>
  <div class="background"></div>

  <main class="app ml-app">

    <div class="game-header ml-header">
      <button id="backToLobbyBtn" class="btn danger small" type="button">Retour lobby</button>
      <div>
        <span id="roomBadge" class="badge">Room</span>
        <h2>Most <span class="ml-cyan">Likely</span></h2>
        <p class="muted">Votez en secret, pariez sur le résultat, assumez le verdict.</p>
      </div>
      <span id="mlRound" class="ml-round">Avant-partie</span>
    </div>

    <div class="ml-layout">
      <div class="ml-main">
        <section id="mlStage" class="ml-stage" aria-live="polite"></section>
        <div id="mlHost" class="ml-host" hidden></div>
      </div>
      <aside class="ml-side">
        <section class="ml-box">
          <h3>Classement <small>🎯 désigné · 🔮 devin</small></h3>
          <div id="mlBoard" class="ml-board"></div>
        </section>
        <details class="ml-box ml-hist">
          <summary>📜 Questions jouées</summary>
          <ol id="mlHistory"></ol>
        </details>
      </aside>
    </div>

  </main>

  <script src="../../partyhub-fx.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
