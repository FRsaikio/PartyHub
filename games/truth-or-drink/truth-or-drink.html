<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Action ou Vérité · PartyHub</title>
  <meta name="theme-color" content="#08061a" />
  <link rel="icon" href="../../partyhub-logo-neon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;700;800&display=swap" />
  <link rel="stylesheet" href="../../neon-club.css" />
  <link rel="stylesheet" href="../../neon-game.css" />
  <link rel="stylesheet" href="truth-or-drink.css" />
</head>

<body>
  <div class="background"></div>

  <main class="app tr-app">

    <div class="game-header tr-header">
      <button id="backToLobbyBtn" class="btn danger small" type="button">Retour lobby</button>
      <div>
        <span id="roomBadge" class="badge">Room</span>
        <h2>Action <span class="tr-pink">ou</span> Vérité</h2>
        <p class="muted">…ou tu bois. Et le groupe juge si tu as triché.</p>
      </div>
      <span id="trRound" class="tr-round">Avant-partie</span>
    </div>

    <div class="tr-layout">
      <div class="tr-main">
        <section id="trStage" class="tr-stage" aria-live="polite"></section>
        <div id="trHost" class="tr-host" hidden></div>
      </div>
      <aside class="tr-side">
        <section class="tr-box">
          <h3>Ordre de passage <small>✅ validés · 🍺 punitions</small></h3>
          <div id="trOrder" class="tr-order"></div>
        </section>
        <details class="tr-box tr-log">
          <summary>📜 Journal</summary>
          <ol id="trLog"></ol>
        </details>
      </aside>
    </div>

  </main>

  <script src="../../partyhub-fx.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
